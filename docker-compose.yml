services:
  db:
    # pgvector image = Postgres with the vector extension already installed.
    # No separate vector database: chunks, embeddings, sessions and chat
    # history all live in one store, so there is one thing to back up.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-notebooklm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notebooklm}
      POSTGRES_DB: ${POSTGRES_DB:-notebooklm}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Exposed for psql during development. Comment this out in production so
      # the database is only reachable from the app container.
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # The app must not start before the database can actually accept
      # connections; a bare "container is running" check is not enough.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-notebooklm} -d ${POSTGRES_DB:-notebooklm}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: >-
        postgresql://${POSTGRES_USER:-notebooklm}:${POSTGRES_PASSWORD:-notebooklm}@db:5432/${POSTGRES_DB:-notebooklm}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      # Where uploaded files are written. Mounted as a volume so an uploaded
      # document survives `docker compose down`.
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    ports:
      - "${APP_PORT:-8000}:8000"
    healthcheck:
      # Hits /api/status, not "/": that endpoint touches the database, so this
      # proves the schema was applied and migrations ran, not just that a port
      # is open. urllib is used because slim images carry no curl.
      test:
        - CMD
        - python
        - -c
        - import urllib.request;urllib.request.urlopen('http://localhost:8000/api/status').read()
      interval: 10s
      timeout: 5s
      retries: 12
      # Generous: the first boot downloads the embedding model, which is slow.
      start_period: 120s
    restart: unless-stopped

volumes:
  pgdata:
  uploads: