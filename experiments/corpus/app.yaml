service: ledger-api
version: 3.2.0
runtime:
  replicas: 6
  memory_limit_mb: 2048
  cpu_limit: 1500
  graceful_shutdown_seconds: 45
database:
  engine: postgres
  host: ledger-db.internal
  port: 5432
  pool_size: 40
  statement_timeout_ms: 8000
cache:
  backend: redis
  ttl_seconds: 600
  max_entries: 250000
rate_limit:
  requests_per_minute: 3000
  burst: 500
observability:
  log_level: info
  trace_sampling_rate: 0.05
features:
  - double_entry_enforcement
  - idempotency_keys
  - webhook_retries
