# Every check, on every push and pull request.
#
# The repo already has one command that runs the whole gate - `./run_tests.sh`,
# backend suite + frontend suite + production build - so CI runs exactly that.
# Running a different command in CI than on a laptop is how the two quietly
# drift apart and the green badge stops meaning anything.
#
# Notes:
#   * The backend suite provisions its own throwaway Postgres (pgvector image
#     on :55432) when none is reachable, which is why no `services:` block is
#     needed here.
#   * OCR language data is installed so the OCR tests run instead of skipping;
#     the suite passes either way, by design.
#   * Embedding and rerank models are downloaded on first use, so their cache
#     directories are cached between runs.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: System libraries the model runtime links against
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgomp1

      - name: Cache the embedding and rerank models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: hf-models-${{ runner.os }}-${{ hashFiles('app/config.py', 'requirements.txt') }}

      - name: Python dependencies
        run: pip install -r requirements.txt

      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: OCR language data (otherwise the OCR tests skip)
        run: python -m app.ocr --install eng

      - name: Backend, frontend, build
        run: ./run_tests.sh
